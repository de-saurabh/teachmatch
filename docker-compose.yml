services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: teachmatch
      POSTGRES_PASSWORD: teachmatch
      POSTGRES_DB: teachmatch
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  postgres-test:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: teachmatch
      POSTGRES_PASSWORD: teachmatch
      POSTGRES_DB: teachmatch_test
    ports:
      - "5433:5432"
    tmpfs:
      - /var/lib/postgresql/data

volumes:
  postgres-data:
